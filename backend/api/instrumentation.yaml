---
instrumentation:
  scope: Соглашение для контролируемого демо. Все перечисленные custom attributes
    — проектные archdrift.*, не стандарт OpenTelemetry.
  identity: resource service.name обязателен. Логические instance/cluster одинаковы
    во всех сервисах; адреса, IP, порты не используются как канонические ID.
  http: HTTP CLIENT определяется наличием http.request.method; SERVER содержит http.request.method
    и по возможности http.route. Пара по trace_id и SERVER.parent_span_id=CLIENT.span_id.
    Destination endpoint строится по SERVER.service.name, method, route. Нет route
    — destination service. Нет SERVER — допускается destination service только при
    явном archdrift.peer.service; иначе unmatchedHttpClientSpans. CLIENT — единственный
    опорный спан, SERVER повторно вызов не считает.
  grpc: CLIENT/SERVER без http.request.method, но с rpc.system или rpc.system.name
    = grpc считается HTTP-спаном с method=POST и route="/"+rpc.method, если rpc.method
    уже содержит "/" (pkg.Service/Method), иначе "/"+rpc.service+"/"+rpc.method.
    Дальше действуют правила http, вид связи http_call. Так gRPC-методы совпадают
    с серверами, которые сами пишут http.route=/pkg.Service/Method.
  owner: 'Для исходящего HTTP, DB или publish ищется ближайший предок в том же сервисе:
    спан с archdrift.worker.name либо HTTP/gRPC SERVER с method+route. Поиск ограничен
    текущим trace, прекращается при переходе в другой service, отсутствии предка или
    цикле. Если владелец не найден — service. Для consume владелец определяется сначала
    по самому process-спану, затем по его предкам. Все наблюдаемые HTTP SERVER и спаны
    с worker.name также создают узлы, даже без исходящих рёбер.'
  worker: Спан запуска задачи содержит archdrift.worker.name. Для Kafka process он
    также содержит устойчивое имя обработчика. Любые goroutine автоматически воркерами
    не считаются.
  postgres: 'CLIENT span: db.system.name=postgresql, db.namespace=<database>, archdrift.postgres.instance=<logical
    instance>. db.operation.name нормализуется uppercase; SELECT/INSERT/UPDATE/DELETE
    сохраняются, остальные/отсутствующие -> OTHER. Ребро owner -> postgres_database,
    type=db_query. SQL и таблицы не парсятся.'
  kafka: messaging.system=kafka, messaging.destination.name=<topic>, archdrift.kafka.cluster=<logical
    cluster>. PRODUCER + messaging.operation.type=send создаёт owner -> topic (publish).
    CONSUMER + messaging.operation.type=process создаёт topic -> owner (consume).
    receive/poll/settle не учитываются в графе. Для batch одна операция равна одному
    спану, не числу сообщений. Нужен один topic на спан.
  asynchronous: Publish и consume строятся независимо; producer/consumer не обязаны
    иметь общий trace или parent. Span links сохраняются для просмотра. End-to-end
    задержка и гарантии доставки не вычисляются.
  missingData: Нет идентичности PostgreSQL/Kafka — unresolvedResourceSpans и без ребра.
    Нет endpoint/worker — service-level fallback с diagnostics. Это снижение детализации,
    не доказательство соответствия декларации.
  discovery: Неизвестные узлы и их родительские сервисы добавляются только в фактический
    граф. Ожидаемая модель автоматически не меняется.
contractDetails:
  info: |-
    ArchDrift MVP: один Go-бэкенд, одна система и одно окружение. Локальный MVP без аутентификации.
    Постоянный приём OTLP; построение графа и сравнение с декларацией по запросу.
    Поддерживаются HTTP endpoints, фоновые воркеры, PostgreSQL-базы и Kafka-топики.
    REST — JSON; ingestion — бинарный OTLP protobuf. Регистрация Collector не требуется.
    Версия 0.3.0: вход — CALM 1.2; отдельная политика разрешений удалена.
    Версия 0.3.1: gRPC CLIENT/SERVER учитываются как http_call (раздел instrumentation.grpc).
    Версия 0.4.0: CALM содержит обязательную ревизию для защиты от потерянных обновлений.
    Граф всегда детальный. Сворачивание endpoints/workers до сервисов выполняет frontend.
    Принадлежность parentId не является ребром взаимодействия и не является наблюдаемым вызовом.
    Контракт инструментации MVP приведён в разделе instrumentation; это соглашение проекта,
    а не утверждение об автоматической поддержке всех приложений и библиотек.
  paths//api/v1/architecture/put: |-
    Входное корневое metadata.archdrift.version — ожидаемая текущая ревизия, не желаемая новая.
    0 разрешает только первое создание (модели нет); успешный PUT сохраняет ревизию N+1.
    Отсутствующая, нецелая или отрицательная версия — 400 validation_error.
    Несовпадение с текущей ревизией — 409 architecture_version_conflict с currentVersion
    (0, если модели ещё нет). Нельзя автоматически повторять PUT, просто подставив currentVersion:
    клиент делает GET и объединяет изменения с новой моделью, затем отправляет её ревизию.
    Сверка и запись должны быть атомарны в БД: условное обновление по версии либо блокировка
    в транзакции. Раздельные SELECT и безусловный UPDATE не обеспечивают защиту.
    Первое создание также атомарно: уникальная запись текущей модели; только один PUT с 0 успешен.
    Два конкурентных PUT с N дают один 200 с N+1 и один 409, без потери первой записи.
    Повтор уже успешного PUT с N также даёт 409, даже если содержимое идентично.
    Успешный PUT с неизменным содержимым и актуальной версией всё равно увеличивает ревизию.
    Исторический анализ использует текущую модель, историю ревизий не храним.
    Проверяются официальная JSON Schema CALM 1.2 и calmProfile ниже.
    CALM сохраняется и возвращается в model без потери дополнительных полей;
    сервер изменяет только корневое metadata.archdrift.version на N+1.
    GET и PUT возвращают version = model.metadata.archdrift.version >= 1.
    Внешние документы и схемы из загрузки не скачиваются; официальные схемы поставляются локально.
    Self-call сервиса и взаимодействия между операциями внутри сервиса допустимы.
    Ошибка валидации или конфликт не изменяет модель, version и updatedAt.
    YAML-импорт вне MVP; endpoint принимает JSON.
  paths//api/v1/analysis/get: |-
    Интервал [from,to); from<to, максимум 24 часа. Одна текущая версия модели и согласованный снимок спанов.
    Нет модели — 409. Нет данных — 200 с узлами модели observed=false, пустыми edges/violations.
    Граф включает узлы модели и наблюдаемые узлы с их родительскими сервисами.
    В интервал должен попадать startTime опорного спана; связанные спаны и предки ищутся во всех сохранённых данных.
    Идентичность и построение описаны в NodeDefinition и instrumentation.
    Спаны могут приходить поздно, повторный анализ того же интервала может измениться.
    Рёбра агрегируются по source,target,type,dbOperation. Один опорный спан учитывается один раз.
    Сопоставление выполняется по calmProfile.matching. Ненаблюдаемые связи не являются нарушениями.
    Только unexpected создаёт unexpected_edge; declared и indeterminate не создают нарушений.
    Отдельного unknown_node нет. Незадекларированные узлы видны в графе с known=false.
    Один violation на ключ unexpected-ребра. Детальные дочерние узлы могут быть покрыты связью сервисов.
    Сортировка: nodes по node.id, edges по source,target,type,dbOperation, violations по type и объекту.
    Frontend сворачивает граф до сервисов для обзора, но проверка декларации выполнена до сворачивания.
    Пагинации нет; frontend может опрашивать каждые 3–5 секунд.
  paths//api/v1/traces/{traceId}/get: |
    Возвращает все доступные спаны, отсортированные по startTime, затем spanId.
    Полнота трейса не гарантируется; поздние спаны могут появиться позже.
    После удаления данных по retention ранее известный traceId может вернуть 404.
  paths//v1/traces/post: |
    Бинарный opentelemetry.proto.collector.trace.v1.ExportTraceServiceRequest.
    Это OTLP endpoint, не REST JSON. MVP поддерживает только protobuf без сжатия;
    Collector должен использовать compression: none. Content-Encoding отсутствует
    либо равен identity. Максимальный размер тела 4 MiB.
    Нулевой размер protobuf допустим и означает пустой пакет.
    Успешные спаны сохраняются до отправки 200. Дедупликация по (trace_id, span_id),
    первая сохранённая запись побеждает. Дубликаты считаются принятыми.
    Спаны с нулевыми/невалидными ID, отсутствующим service.name или end < start
    отклоняются через partial_success с rejected_spans и error_message.
    Неразбираемый protobuf возвращает 400; временная ошибка БД — 503.
    OpenAPI описывает бинарные тела как string/binary; protobuf-типы берутся из
    официального opentelemetry-proto, их Go-типы не генерируются из этого YAML.
  components/schemas/Edge: |-
    Ключ агрегации: source,target,type,dbOperation. dbOperation обязателен только для db_query,
    для остальных отсутствует. matchedRelationshipIds — все совпавшие connects, по unique-id.
    Статусы определены в calmProfile.matching. Метрики по опорному спану:
    HTTP CLIENT; DB CLIENT; Kafka PRODUCER send; Kafka CONSUMER process.
    Для consume длительность — обработка, не время в очереди. Повторная обработка с новым spanId
    считается отдельной операцией, повторная доставка того же спана — нет.
  components/schemas/AttributeValue/properties/value: |
    Строковое представление для UI. string — исходный текст, bool — true/false,
    int — десятичный int64, double — число или NaN/Infinity/-Infinity,
    bytes — base64, array и kvlist — JSON-текст массива/объекта значений
    в таком же формате AttributeValue. Int64 не теряет точность в JS.
  components/schemas/NodeDefinition: |-
    ID вычисляется из идентифицирующих полей. enc — percent-encoding UTF-8: сохраняются только
    A-Z a-z 0-9 - . _ ~, остальные байты %HH с верхним регистром hex. Пробел не заменяется на +.
    service:enc(serviceName)
    endpoint:enc(serviceName):enc(method):enc(route)
    worker:enc(serviceName):enc(workerName)
    postgres:enc(instance):enc(database)
    kafka:enc(cluster):enc(topic)
    Для endpoint/worker имя сервиса берётся из parentId. parentId обязательно указывает на service.
    У service, postgres_database, kafka_topic parentId отсутствует. Идентичность регистрозависима;
    label не участвует в сопоставлении. Это ID выходного графа, а не CALM unique-id. Дубли привязок отклоняются при PUT.

calmProfile:
  version: '1.2'
  schema: https://calm.finos.org/release/1.2/meta/calm.json
  scope: |-
    Один самодостаточный JSON. Поддерживаются nodes, connects и composed-of для worker.
    Минимум один service. Другие node-type и relationship-type отклоняются с validation_error.
    flows, controls, standards, decorators, timelines и details отклоняются как неподдерживаемые,
    чтобы не создавать видимость их проверки. Прочие описательные поля сохраняются.
    metadata в профиле — объект. Неизвестные поля metadata.archdrift отклоняются.
    Старые корневые rules/defaultAction отклоняются. Это профиль ArchDrift, не весь CALM.
  bindings: |-
    Корень документа содержит metadata.archdrift.version (целая ревизия >= 0 во входе PUT,
    >= 1 в сохранённой модели); других полей в корневом metadata.archdrift нет.
    Это ревизия ArchDrift для конкурентной записи, не CALM $schema или версия приложения.
    Каждый узел содержит metadata.archdrift с обязательными полями для своего node-type:
    service: serviceName; database (только PostgreSQL): instance, database;
    worker: workerName; kafka-topic: cluster, topic. Другие поля привязки не допускаются.
    worker принадлежит ровно одному service через composed-of {container: serviceId, nodes: [workerId]}.
    Другие composed-of и циклы не поддерживаются. Вложенные worker не допускаются.
    Только service может иметь interfaces. Каждый интерфейс задаёт unique-id и metadata.archdrift
    с method и route (HTTP-метод uppercase и шаблон маршрута); definition-url/config не поддерживаются.
    Ограничения значений соответствуют ServiceNode/EndpointNode/WorkerNode/PostgresNode/KafkaTopicNode.
    CALM unique-id — непустые строки; узлы и связи уникальны в своих массивах,
    интерфейсы — внутри узла. Привязки к каноническим идентичностям не дублируются.
    CALM ID не обязаны совпадать с service.name или каноническими ID выходного графа.
    label строится из CALM name, а при пустом name — из unique-id узла;
    для endpoint — из method и route. Результат обрезается до 255 символов.
    GraphNode.known означает точное объявление; calmNodeId/calmInterfaceId есть только при known=true.
  relationships: |-
    connects.source/destination: node ссылается на CALM узел; interfaces — необязательный
    непустой список уникальных ID интерфейсов этого service. Отсутствие interfaces — весь узел.
    Несколько interfaces задают альтернативы, два списка — все пары источника и назначения.
    Необязательное metadata.archdrift.type: http_call, db_query, publish или consume.
    Без type вид операции не ограничен. Допустимые пары после нормализации:
    http_call: service|endpoint|worker -> service|endpoint;
    db_query: service|endpoint|worker -> postgres_database;
    publish: service|endpoint|worker -> kafka_topic;
    consume: kafka_topic -> service|endpoint|worker.
    Связь должна допускать хотя бы одну пару; явный type обязан быть совместим с концами.
    SQL-операции остаются детализацией наблюдений; фильтров dbOperations нет.
    protocol при наличии должен соответствовать type: HTTP/HTTPS -> http_call,
    JDBC -> db_query; TCP не ограничивает вид операции (Kafka определяется по type или концам).
    Другие значения protocol отклоняются в MVP.
    protocol и type совместно ограничивают вид операции; HTTP и HTTPS отдельно не различаются.
    composed-of задаёт только принадлежность, не декларацию взаимодействия.
  matching: |-
    Сервис без interfaces в конце connects охватывает себя и непосредственные endpoints/workers, включая необъявленные.
    Конкретный интерфейс/worker/ресурс совпадает только с собственной идентичностью.
    declared: есть хотя бы одно полное совпадение направления, концов и вида операции.
    Широкая декларация не сужается добавлением конкретной. Обратные и транзитивные связи не выводятся.
    Если полного совпадения нет, но service-level fallback мог бы совпасть с конкретным дочерним
    селектором того же сервиса при наличии детализации, статус indeterminate.
    Для такого кандидата остальные известные концы и вид операции должны быть совместимы.
    Если нет ни полного, ни возможного совпадения — unexpected и unexpected_edge.
    matchedRelationshipIds заполнен только для declared, иначе пуст.
    known=false у endpoint/worker не создаёт нарушения при покрытии широкой декларацией.
    Отсутствие наблюдений не считается drift; неизвестный сервис/ресурс не совпадает с известным.
